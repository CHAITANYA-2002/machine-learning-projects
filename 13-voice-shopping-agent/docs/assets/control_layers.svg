<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Control layers for a safer voice shopping prototype</title><desc id="desc">The diagram shows controls at input, model, browser and user-action layers.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#172536}.h{font-size:24px;font-weight:700}.s{font-size:16px}.row{fill:#fff;stroke:#d6e0e8;stroke-width:2}.tag{fill:#246ca5}.arrow{stroke:#6c7e8e;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#6c7e8e"/></marker></defs><rect width="1200" height="420" fill="#fbfcfe"/><text class="t h" x="600" y="45" text-anchor="middle">Safety is a chain of controls, not a single confirmation prompt</text><g class="t"><rect class="row" x="90" y="90" width="1020" height="55" rx="10"/><rect class="tag" x="90" y="90" width="185" height="55" rx="10"/><text x="182" y="124" text-anchor="middle" fill="white" class="h">Input</text><text x="315" y="124" class="s">Speech confirmation · bounded transcription handling · no silent retry</text><rect class="row" x="90" y="165" width="1020" height="55" rx="10"/><rect class="tag" x="90" y="165" width="185" height="55" rx="10"/><text x="182" y="199" text-anchor="middle" fill="white" class="h">Model</text><text x="315" y="199" class="s">Treat LLM output as untrusted · validate shape, text and quantity</text><rect class="row" x="90" y="240" width="1020" height="55" rx="10"/><rect class="tag" x="90" y="240" width="185" height="55" rx="10"/><text x="182" y="274" text-anchor="middle" fill="white" class="h">Browser</text><text x="315" y="274" class="s">Visible cart · current selectors reviewed · stop on MFA, captcha or mismatch</text><rect class="row" x="90" y="315" width="1020" height="55" rx="10"/><rect class="tag" x="90" y="315" width="185" height="55" rx="10"/><text x="182" y="349" text-anchor="middle" fill="white" class="h">Commitment</text><text x="315" y="349" class="s">Manual checkout and payment · no card, OTP, address or order submission automation</text></g></svg>
