<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Voice shopping assistant flow with validation and manual checkout</title><desc id="desc">Speech becomes a transcript, then an untrusted LLM cart proposal, validation, confirmation, browser cart update and manual checkout.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#172536}.h{font-size:23px;font-weight:700}.s{font-size:15px}.b{stroke-width:3}.voice{fill:#e9f3fc;stroke:#2d74ad}.model{fill:#f3edff;stroke:#725ab0}.guard{fill:#fff3df;stroke:#b97919}.human{fill:#e9f8ef;stroke:#25835b}.stop{fill:#fff0ed;stroke:#bd6144}.arrow{stroke:#65788b;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#65788b"/></marker></defs><rect width="1200" height="440" fill="#fbfcfe"/><text class="t h" x="600" y="45" text-anchor="middle">The assistant can help build a cart; the user remains in control of every commitment</text><g class="t" text-anchor="middle"><rect class="b voice" x="25" y="160" width="145" height="90" rx="12"/><text class="h" x="98" y="198">Voice input</text><text class="s" x="98" y="222">microphone</text><rect class="b voice" x="215" y="160" width="145" height="90" rx="12"/><text class="h" x="288" y="198">Transcript</text><text class="s" x="288" y="222">speech-to-text</text><rect class="b model" x="405" y="160" width="165" height="90" rx="12"/><text class="h" x="488" y="198">LLM proposal</text><text class="s" x="488" y="222">untrusted JSON</text><rect class="b guard" x="615" y="160" width="175" height="90" rx="12"/><text class="h" x="703" y="198">Validation</text><text class="s" x="703" y="222">text + quantity bounds</text><rect class="b human" x="835" y="160" width="150" height="90" rx="12"/><text class="h" x="910" y="198">User confirms</text><text class="s" x="910" y="222">items and store</text><rect class="b human" x="1030" y="160" width="145" height="90" rx="12"/><text class="h" x="1103" y="198">Visible cart</text><text class="s" x="1103" y="222">browser review</text></g><path class="arrow" d="M170 205h45"/><path class="arrow" d="M360 205h45"/><path class="arrow" d="M570 205h45"/><path class="arrow" d="M790 205h45"/><path class="arrow" d="M985 205h45"/><rect class="b stop" x="910" y="320" width="205" height="62" rx="12"/><text class="t h" x="1012" y="347" text-anchor="middle">Manual checkout only</text><text class="t s" x="1012" y="370" text-anchor="middle">no card, OTP or order submission</text><path class="arrow" d="M1103 250c0 48-45 45-90 70" fill="none"/></svg>
