<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Validation gates for a research colour-normalisation workflow</title><desc id="desc">Five gates proceed from governed inputs to monitoring, with a stop condition before clinical use.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#172334}.h{font-size:25px;font-weight:700}.s{font-size:16px}.box{fill:#fff;stroke:#d4dce6;stroke-width:2}.num{fill:#2f75b5}.warn{fill:#fff5e9;stroke:#ce7a13;stroke-width:3}.arrow{stroke:#6d7d90;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#6d7d90"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfcfe"/><text class="t h" x="600" y="48" text-anchor="middle">A normalised image is only useful when each validation gate is passed</text>
  <g transform="translate(48 115)"><rect class="box" width="185" height="150" rx="14"/><circle class="num" cx="28" cy="30" r="17"/><text class="t s" x="28" y="36" text-anchor="middle" fill="white">1</text><text class="t h" x="93" y="61" text-anchor="middle">Governed inputs</text><text class="t s" x="93" y="93" text-anchor="middle">licence, access,</text><text class="t s" x="93" y="116" text-anchor="middle">de-identification</text></g>
  <g transform="translate(275 115)"><rect class="box" width="185" height="150" rx="14"/><circle class="num" cx="28" cy="30" r="17"/><text class="t s" x="28" y="36" text-anchor="middle" fill="white">2</text><text class="t h" x="93" y="61" text-anchor="middle">Reference protocol</text><text class="t s" x="93" y="93" text-anchor="middle">selection rationale,</text><text class="t s" x="93" y="116" text-anchor="middle">version and hash</text></g>
  <g transform="translate(502 115)"><rect class="box" width="185" height="150" rx="14"/><circle class="num" cx="28" cy="30" r="17"/><text class="t s" x="28" y="36" text-anchor="middle" fill="white">3</text><text class="t h" x="93" y="61" text-anchor="middle">Technical checks</text><text class="t s" x="93" y="93" text-anchor="middle">channel shift, clipping,</text><text class="t s" x="93" y="116" text-anchor="middle">reproducible logs</text></g>
  <g transform="translate(729 115)"><rect class="box" width="185" height="150" rx="14"/><circle class="num" cx="28" cy="30" r="17"/><text class="t s" x="28" y="36" text-anchor="middle" fill="white">4</text><text class="t h" x="93" y="61" text-anchor="middle">Expert review</text><text class="t s" x="93" y="93" text-anchor="middle">held-out samples,</text><text class="t s" x="93" y="116" text-anchor="middle">documented failures</text></g>
  <g transform="translate(956 115)"><rect class="warn" width="196" height="150" rx="14"/><text class="t h" x="98" y="60" text-anchor="middle">Research only</text><text class="t s" x="98" y="94" text-anchor="middle">no diagnosis or</text><text class="t s" x="98" y="117" text-anchor="middle">clinical decision use</text></g>
  <path class="arrow" d="M233 190H275"/><path class="arrow" d="M460 190H502"/><path class="arrow" d="M687 190H729"/><path class="arrow" d="M914 190H956"/>
  <text class="t s" x="600" y="340" text-anchor="middle">A visually pleasing transformation is not evidence that diagnostically relevant structure has been preserved.</text>
</svg>
