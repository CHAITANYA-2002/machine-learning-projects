<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Reference-based LAB colour normalisation pipeline</title>
  <desc id="desc">Source and reference RGB images are converted to LAB, summarised by channel means and standard deviations, then used to create a normalised RGB output.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#172334}.s{font-size:18px}.h{font-size:28px;font-weight:700}.b{fill:#fff;stroke:#cfd9e3;stroke-width:2}.source{fill:#edf5ff;stroke:#2f75b5;stroke-width:3}.ref{fill:#fff1ed;stroke:#c85c3e;stroke-width:3}.calc{fill:#f4f0ff;stroke:#7659bc;stroke-width:3}.out{fill:#eaf8f1;stroke:#24855c;stroke-width:3}.arrow{stroke:#64768a;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64768a"/></marker></defs>
  <rect width="1200" height="560" fill="#fbfcfe"/><text class="t h" x="600" y="55" text-anchor="middle">Every output is shaped by two images: the source and the selected reference</text>
  <rect class="source" x="55" y="148" width="190" height="115" rx="14"/><text class="t h" x="150" y="193" text-anchor="middle">Source image</text><text class="t s" x="150" y="225" text-anchor="middle">RGB pixels to adjust</text>
  <rect class="ref" x="55" y="334" width="190" height="115" rx="14"/><text class="t h" x="150" y="379" text-anchor="middle">Reference image</text><text class="t s" x="150" y="411" text-anchor="middle">chosen colour target</text>
  <rect class="b" x="340" y="105" width="205" height="115" rx="14"/><text class="t h" x="443" y="150" text-anchor="middle">Convert to LAB</text><text class="t s" x="443" y="181" text-anchor="middle">separate L, a and b</text>
  <rect class="b" x="340" y="340" width="205" height="115" rx="14"/><text class="t h" x="443" y="385" text-anchor="middle">Convert to LAB</text><text class="t s" x="443" y="416" text-anchor="middle">same colour space</text>
  <rect class="calc" x="650" y="185" width="245" height="160" rx="14"/><text class="t h" x="773" y="228" text-anchor="middle">Match statistics</text><text class="t s" x="773" y="265" text-anchor="middle">per channel:</text><text class="t s" x="773" y="293" text-anchor="middle">source mean → reference mean</text><text class="t s" x="773" y="321" text-anchor="middle">source spread → reference spread</text>
  <rect class="out" x="1000" y="205" width="155" height="120" rx="14"/><text class="t h" x="1078" y="250" text-anchor="middle">Output</text><text class="t s" x="1078" y="281" text-anchor="middle">LAB → RGB</text>
  <path class="arrow" d="M245 205H340"/><path class="arrow" d="M245 391H340"/><path class="arrow" d="M545 162C610 162 608 220 650 220" fill="none"/><path class="arrow" d="M545 397C610 397 608 310 650 310" fill="none"/><path class="arrow" d="M895 265H1000"/>
  <text class="t s" x="600" y="510" text-anchor="middle">The method standardises global colour distribution; it does not establish tissue quality, diagnosis, or clinical equivalence.</text>
</svg>
