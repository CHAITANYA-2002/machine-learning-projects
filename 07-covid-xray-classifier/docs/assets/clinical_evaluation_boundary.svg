<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360"><rect width="1400" height="360" rx="26" fill="#fbf7f7"/><text x="65" y="62" font-family="Arial" font-size="31" font-weight="700" fill="#2a2020">A model score becomes clinically meaningful only after a leakage-safe evaluation</text><g font-family="Arial" text-anchor="middle"><rect x="65" y="135" width="235" height="110" rx="16" fill="#fff0f0" stroke="#e7aaaa" stroke-width="2"/><text x="182" y="178" font-size="21" font-weight="700" fill="#2a2020">X-ray images</text><text x="182" y="208" font-size="16" fill="#795b5b">patients, sites, scanners</text><path d="M315 190h85M400 190l-16-11v22z" stroke="#9b7c7c" stroke-width="5" fill="#9b7c7c"/><rect x="416" y="135" width="250" height="110" rx="16" fill="#fff3dd" stroke="#e1b66d" stroke-width="2"/><text x="541" y="178" font-size="21" font-weight="700" fill="#2a2020">Patient/site split</text><text x="541" y="208" font-size="16" fill="#795b5b">prevent source leakage</text><path d="M681 190h85M766 190l-16-11v22z" stroke="#9b7c7c" stroke-width="5" fill="#9b7c7c"/><rect x="782" y="135" width="235" height="110" rx="16" fill="#f0edff" stroke="#b9a8ee" stroke-width="2"/><text x="899" y="178" font-size="21" font-weight="700" fill="#2a2020">Model fitting</text><text x="899" y="208" font-size="16" fill="#795b5b">training-only transforms</text><path d="M1032 190h85M1117 190l-16-11v22z" stroke="#9b7c7c" stroke-width="5" fill="#9b7c7c"/><rect x="1133" y="135" width="205" height="110" rx="16" fill="#eaf6f0" stroke="#8dccad" stroke-width="2"/><text x="1235" y="174" font-size="21" font-weight="700" fill="#2a2020">Clinical metrics</text><text x="1235" y="204" font-size="16" fill="#795b5b">sensitivity, specificity, calibration</text></g><text x="700" y="312" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#ad3f4f">An image-level random split can reward hospital/scanner artefacts instead of disease signal.</text></svg>
