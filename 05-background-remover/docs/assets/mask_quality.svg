<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="t d"><title id="t">Mask-quality evaluation boundary</title><desc id="d">Predicted mask and ground-truth mask create overlap metrics only when labelled evaluation images exist.</desc><rect width="1400" height="330" rx="26" fill="#f6faf8"/><text x="65" y="64" font-family="Arial" font-size="32" font-weight="700" fill="#17281f">What is needed before making a mask-quality claim</text><g font-family="Arial" text-anchor="middle"><rect x="100" y="130" width="275" height="110" rx="16" fill="#e9f5f0" stroke="#83cbb0" stroke-width="2"/><text x="237" y="174" font-size="21" font-weight="700" fill="#17281f">Predicted mask</text><text x="237" y="205" font-size="17" fill="#597165">model or contour output</text><rect x="525" y="130" width="275" height="110" rx="16" fill="#edf0ff" stroke="#a7b2ec" stroke-width="2"/><text x="662" y="174" font-size="21" font-weight="700" fill="#17281f">Ground-truth mask</text><text x="662" y="205" font-size="17" fill="#597165">human-labelled evaluation set</text><path d="M390 185h110M500 185l-16-11v22zM815 185h110M925 185l-16-11v22z" stroke="#7b9589" stroke-width="5" fill="#7b9589"/><rect x="940" y="130" width="340" height="110" rx="16" fill="#fff5df" stroke="#e2bd70" stroke-width="2"/><text x="1110" y="169" font-size="21" font-weight="700" fill="#17281f">Evaluation metrics</text><text x="1110" y="199" font-size="17" fill="#597165">IoU · Dice · boundary F-score</text></g><text x="700" y="292" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#b54653">Without labelled masks, visual outputs are demonstrations—not quantitative evidence.</text></svg>
