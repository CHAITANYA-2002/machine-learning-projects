<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="t d"><title id="t">Three background-removal paths</title><desc id="d">An input image takes pretrained instance segmentation, classical CV, or U-Net training paths to produce a foreground mask and composited image.</desc><rect width="1400" height="430" rx="26" fill="#f6faf8"/><text x="65" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#17281f">Background removal begins with a mask—not with a finished cut-out</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="160" width="220" height="112" rx="16" fill="#e9f5f0" stroke="#83cbb0" stroke-width="2"/><text x="170" y="203" font-size="22" font-weight="700" fill="#17281f">Input image</text><text x="170" y="233" font-size="17" fill="#597165">foreground + context</text><path d="M296 215h82M378 215l-16-11v22z" stroke="#7b9589" stroke-width="5" fill="#7b9589"/><rect x="395" y="100" width="260" height="95" rx="15" fill="#edf0ff" stroke="#a7b2ec" stroke-width="2"/><text x="525" y="139" font-size="21" font-weight="700" fill="#17281f">Detectron2</text><text x="525" y="166" font-size="16" fill="#597165">learned COCO instance mask</text><rect x="395" y="224" width="260" height="95" rx="15" fill="#fff5df" stroke="#e2bd70" stroke-width="2"/><text x="525" y="263" font-size="21" font-weight="700" fill="#17281f">Classical CV</text><text x="525" y="290" font-size="16" fill="#597165">edges + contours + morphology</text><rect x="395" y="345" width="260" height="58" rx="15" fill="#f2ebff" stroke="#ba9ee5" stroke-width="2"/><text x="525" y="380" font-size="19" font-weight="700" fill="#17281f">COCO U-Net training</text><path d="M672 147h104M776 147l-16-11v22zM672 271h104M776 271l-16-11v22zM672 374h104M776 374l-16-11v22z" stroke="#7b9589" stroke-width="5" fill="#7b9589"/><rect x="793" y="160" width="220" height="112" rx="16" fill="#e9f5f0" stroke="#83cbb0" stroke-width="2"/><text x="903" y="203" font-size="22" font-weight="700" fill="#17281f">Foreground mask</text><text x="903" y="233" font-size="17" fill="#597165">pixel-level decision</text><path d="M1029 215h82M1111 215l-16-11v22z" stroke="#7b9589" stroke-width="5" fill="#7b9589"/><rect x="1128" y="160" width="215" height="112" rx="16" fill="#dff3e9" stroke="#58b989" stroke-width="2"/><text x="1235" y="203" font-size="22" font-weight="700" fill="#17281f">Composite output</text><text x="1235" y="233" font-size="17" fill="#597165">transparent or replaced BG</text></g><text x="700" y="420" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#b54653">A convincing composite is not a pixel-accuracy measurement. Ground-truth masks are required for IoU, Dice, or boundary claims.</text></svg>
