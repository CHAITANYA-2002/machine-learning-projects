<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Simple and regularised neural network architecture comparison</title><desc id="desc">A simple dense network is compared with a deeper network using batch normalisation and dropout.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#182535}.h{font-size:27px;font-weight:700}.s{font-size:17px}.b{stroke-width:3}.input{fill:#eaf3fb;stroke:#2c72ad}.dense{fill:#f4f0ff;stroke:#7257ac}.norm{fill:#fff3df;stroke:#b87518}.drop{fill:#fff0ed;stroke:#bd6043}.output{fill:#e9f8ef;stroke:#25825b}.arrow{stroke:#66788a;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#66788a"/></marker></defs><rect width="1200" height="560" fill="#fbfcfe"/><text class="t h" x="600" y="48" text-anchor="middle">Two ways to expose a network to random-label data</text><text class="t h" x="295" y="100" text-anchor="middle">Simple network</text><text class="t h" x="875" y="100" text-anchor="middle">Regularised network</text><g class="t s" text-anchor="middle"><rect class="b input" x="205" y="140" width="180" height="54" rx="10"/><text x="295" y="173">Input: 1,000 features</text><rect class="b dense" x="205" y="245" width="180" height="54" rx="10"/><text x="295" y="278">Dense 128 · ReLU</text><rect class="b output" x="205" y="350" width="180" height="54" rx="10"/><text x="295" y="383">Dense 1 · sigmoid</text><rect class="b input" x="785" y="120" width="180" height="48" rx="10"/><text x="875" y="150">Input: 1,000 features</text><rect class="b dense" x="785" y="192" width="180" height="48" rx="10"/><text x="875" y="222">Dense 256 · ReLU</text><rect class="b norm" x="785" y="264" width="180" height="48" rx="10"/><text x="875" y="294">Batch normalisation</text><rect class="b drop" x="785" y="336" width="180" height="48" rx="10"/><text x="875" y="366">Dropout · 0.5</text><rect class="b dense" x="785" y="408" width="180" height="48" rx="10"/><text x="875" y="438">Dense 128 · ReLU</text></g><path class="arrow" d="M295 194v51"/><path class="arrow" d="M295 299v51"/><path class="arrow" d="M875 168v24"/><path class="arrow" d="M875 240v24"/><path class="arrow" d="M875 312v24"/><path class="arrow" d="M875 384v24"/><text class="t s" x="875" y="505" text-anchor="middle">… then BatchNorm → Dropout → Dense 1 sigmoid</text><text class="t s" x="600" y="535" text-anchor="middle">Neither architecture can learn a true relationship when labels are independent random draws.</text></svg>
