<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">How to interpret neural-network accuracy on random labels</title><desc id="desc">The diagram shows random features and labels, then contrasts high training accuracy with chance validation accuracy.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#182535}.h{font-size:25px;font-weight:700}.s{font-size:16px}.b{fill:#fff;stroke:#d2dce6;stroke-width:2}.bad{fill:#fff1ed;stroke:#c46748;stroke-width:3}.good{fill:#eaf8f0;stroke:#2b845d;stroke-width:3}.arrow{stroke:#66788a;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#66788a"/></marker></defs><rect width="1200" height="430" fill="#fbfcfe"/><text class="t h" x="600" y="48" text-anchor="middle">Random labels make validation accuracy a test of honesty, not capability</text><rect class="b" x="45" y="135" width="230" height="125" rx="14"/><text class="t h" x="160" y="180" text-anchor="middle">Synthetic data</text><text class="t s" x="160" y="212" text-anchor="middle">X: random features</text><text class="t s" x="160" y="237" text-anchor="middle">y: random 0/1 labels</text><rect class="b" x="400" y="135" width="230" height="125" rx="14"/><text class="t h" x="515" y="180" text-anchor="middle">No signal</text><text class="t s" x="515" y="212" text-anchor="middle">features do not explain</text><text class="t s" x="515" y="237" text-anchor="middle">the label assignment</text><rect class="bad" x="755" y="90" width="360" height="120" rx="14"/><text class="t h" x="935" y="133" text-anchor="middle">High training accuracy</text><text class="t s" x="935" y="164" text-anchor="middle">can mean a flexible network</text><text class="t s" x="935" y="188" text-anchor="middle">memorised random assignments</text><rect class="good" x="755" y="250" width="360" height="120" rx="14"/><text class="t h" x="935" y="293" text-anchor="middle">≈50% validation accuracy</text><text class="t s" x="935" y="324" text-anchor="middle">is the expected binary result</text><text class="t s" x="935" y="348" text-anchor="middle">when no predictive signal exists</text><path class="arrow" d="M275 198h125"/><path class="arrow" d="M630 190h125"/><path class="arrow" d="M630 210c65 0 65 100 125 100" fill="none"/></svg>
