<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Interpretation boundary for super-resolution output</title><desc id="desc">The output is useful for non-critical presentation after provenance is recorded, but is not recovered evidence or suitable for critical interpretation.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#192536}.h{font-size:25px;font-weight:700}.s{font-size:16px}.base{fill:#eaf3fb;stroke:#2c72ad;stroke-width:3}.safe{fill:#e9f8ef;stroke:#27825c;stroke-width:3}.unsafe{fill:#fff0ed;stroke:#bd6145;stroke-width:3}.arrow{stroke:#66788a;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#66788a"/></marker></defs><rect width="1200" height="400" fill="#fbfcfe"/><text class="t h" x="600" y="48" text-anchor="middle">A sharper output changes presentation, not the evidentiary status of the source</text><rect class="base" x="50" y="135" width="270" height="125" rx="14"/><text class="t h" x="185" y="181" text-anchor="middle">Original low-resolution image</text><text class="t s" x="185" y="214" text-anchor="middle">retain unchanged with provenance</text><rect class="base" x="455" y="135" width="270" height="125" rx="14"/><text class="t h" x="590" y="181" text-anchor="middle">RRDB super-resolution</text><text class="t s" x="590" y="214" text-anchor="middle">learned plausible detail</text><rect class="safe" x="860" y="85" width="280" height="110" rx="14"/><text class="t h" x="1000" y="129" text-anchor="middle">Potentially appropriate</text><text class="t s" x="1000" y="158" text-anchor="middle">labelled creative presentation</text><rect class="unsafe" x="860" y="235" width="280" height="110" rx="14"/><text class="t h" x="1000" y="279" text-anchor="middle">Not appropriate</text><text class="t s" x="1000" y="308" text-anchor="middle">forensic, medical or legal evidence</text><path class="arrow" d="M320 197h135"/><path class="arrow" d="M725 168h135"/><path class="arrow" d="M725 230h135"/></svg>
