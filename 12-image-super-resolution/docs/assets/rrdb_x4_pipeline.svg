<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">RRDBNet four-times image super-resolution pipeline</title><desc id="desc">An input image moves through feature extraction, 23 RRDB blocks, two two-times upsampling stages and RGB reconstruction.</desc><defs><style>.t{font-family:Arial,sans-serif;fill:#192536}.h{font-size:26px;font-weight:700}.s{font-size:16px}.b{stroke-width:3}.input{fill:#eaf3fb;stroke:#2c72ad}.core{fill:#f3efff;stroke:#7659b4}.up{fill:#fff3e5;stroke:#b87416}.out{fill:#e9f8ef;stroke:#26815a}.arrow{stroke:#66788a;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#66788a"/></marker></defs><rect width="1200" height="480" fill="#fbfcfe"/><text class="t h" x="600" y="48" text-anchor="middle">RRDBNet expands a low-resolution image by two sequential 2× stages</text><g class="t" text-anchor="middle"><rect class="b input" x="42" y="175" width="165" height="102" rx="13"/><text class="h" x="124" y="214">Input RGB</text><text class="s" x="124" y="244">H × W × 3</text><rect class="b core" x="280" y="175" width="180" height="102" rx="13"/><text class="h" x="370" y="214">Feature stem</text><text class="s" x="370" y="244">3 → 64 channels</text><rect class="b core" x="535" y="150" width="195" height="152" rx="13"/><text class="h" x="633" y="195">23 RRDB blocks</text><text class="s" x="633" y="226">dense residual paths</text><text class="s" x="633" y="252">with residual scaling</text><rect class="b up" x="805" y="145" width="135" height="162" rx="13"/><text class="h" x="873" y="189">Upsample</text><text class="s" x="873" y="220">2×</text><text class="s" x="873" y="252">then 2×</text><rect class="b out" x="1015" y="175" width="145" height="102" rx="13"/><text class="h" x="1088" y="214">Output RGB</text><text class="s" x="1088" y="244">4H × 4W × 3</text></g><path class="arrow" d="M207 226h73"/><path class="arrow" d="M460 226h75"/><path class="arrow" d="M730 226h75"/><path class="arrow" d="M940 226h75"/><text class="t s" x="600" y="375" text-anchor="middle">A compatible learned checkpoint supplies the weights. Architecture alone produces random, unusable output.</text><text class="t s" x="600" y="408" text-anchor="middle">The 4× output contains a learned reconstruction of high-frequency detail; it is not evidence that the detail existed in the source.</text></svg>
