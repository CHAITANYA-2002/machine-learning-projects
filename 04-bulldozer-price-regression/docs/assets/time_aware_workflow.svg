<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc"><title id="title">Time-aware auction price regression workflow</title><desc id="desc">Historical records flow through a date cutoff to training, later validation, RMSLE and final test predictions.</desc><rect width="1400" height="360" rx="26" fill="#f7f9fc"/><text x="70" y="65" fill="#182536" font-family="Arial, sans-serif" font-size="31" font-weight="700">A forecast-style workflow: the future stays out of training</text><g font-family="Arial, sans-serif" text-anchor="middle"><g><rect x="62" y="135" width="210" height="110" rx="16" fill="#e8f1fb" stroke="#9dbbe0" stroke-width="2"/><text x="167" y="180" fill="#182536" font-size="21" font-weight="700">Auction history</text><text x="167" y="212" fill="#5e6c82" font-size="17">sale date + machine data</text></g><path d="M286 190h92" stroke="#8292a8" stroke-width="5"/><path d="M378 190l-17-11v22z" fill="#8292a8"/><g><rect x="394" y="135" width="210" height="110" rx="16" fill="#fff4de" stroke="#dfaa50" stroke-width="2"/><text x="499" y="180" fill="#182536" font-size="21" font-weight="700">Date cutoff</text><text x="499" y="212" fill="#5e6c82" font-size="17">not a random split</text></g><path d="M618 190h92" stroke="#8292a8" stroke-width="5"/><path d="M710 190l-17-11v22z" fill="#8292a8"/><g><rect x="726" y="135" width="210" height="110" rx="16" fill="#eaf7f1" stroke="#83c8b5" stroke-width="2"/><text x="831" y="180" fill="#182536" font-size="21" font-weight="700">Train on the past</text><text x="831" y="212" fill="#5e6c82" font-size="17">fit transformations + forest</text></g><path d="M950 190h92" stroke="#8292a8" stroke-width="5"/><path d="M1042 190l-17-11v22z" fill="#8292a8"/><g><rect x="1058" y="135" width="280" height="110" rx="16" fill="#f0edff" stroke="#a998ff" stroke-width="2"/><text x="1198" y="180" fill="#182536" font-size="21" font-weight="700">Validate on later sales</text><text x="1198" y="212" fill="#5e6c82" font-size="17">RMSLE before final test predictions</text></g></g><text x="700" y="305" text-anchor="middle" fill="#b13e54" font-family="Arial, sans-serif" font-size="18" font-weight="700">A random split can leak later market conditions into training and overstate performance.</text></svg>
