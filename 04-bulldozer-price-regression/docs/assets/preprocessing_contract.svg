<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Training-fitted preprocessing contract</title><desc id="desc">A fitted transformer learns medians and category codes from training data then applies the same transformation to validation and test records.</desc><rect width="1400" height="430" rx="26" fill="#f7f9fc"/><text x="70" y="65" fill="#182536" font-family="Arial, sans-serif" font-size="31" font-weight="700">One fitted preprocessing contract keeps train, validation, and test aligned</text><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="85" y="138" width="250" height="135" rx="16" fill="#eaf7f1" stroke="#83c8b5" stroke-width="2"/><text x="210" y="183" fill="#182536" font-size="22" font-weight="700">Training records</text><text x="210" y="215" fill="#5e6c82" font-size="17">learn medians, modes,</text><text x="210" y="239" fill="#5e6c82" font-size="17">and category mappings</text><path d="M350 205h120" stroke="#8292a8" stroke-width="5"/><path d="M470 205l-17-11v22z" fill="#8292a8"/><rect x="486" y="120" width="400" height="170" rx="18" fill="#fff4de" stroke="#dfaa50" stroke-width="3"/><text x="686" y="166" fill="#182536" font-size="24" font-weight="700">Fitted pipeline</text><text x="686" y="203" fill="#5e6c82" font-size="18">numeric: median + missing indicator</text><text x="686" y="231" fill="#5e6c82" font-size="18">categorical: mode + ordinal code</text><text x="686" y="259" fill="#5e6c82" font-size="18">new categories: safe sentinel −1</text><path d="M902 174h105" stroke="#8292a8" stroke-width="5"/><path d="M1007 174l-17-11v22z" fill="#8292a8"/><path d="M902 240h105" stroke="#8292a8" stroke-width="5"/><path d="M1007 240l-17-11v22z" fill="#8292a8"/><rect x="1023" y="112" width="285" height="112" rx="16" fill="#f0edff" stroke="#a998ff" stroke-width="2"/><text x="1165" y="157" fill="#182536" font-size="21" font-weight="700">Later validation</text><text x="1165" y="190" fill="#5e6c82" font-size="17">transform + predict only</text><rect x="1023" y="255" width="285" height="112" rx="16" fill="#e8f1fb" stroke="#9dbbe0" stroke-width="2"/><text x="1165" y="300" fill="#182536" font-size="21" font-weight="700">Competition test</text><text x="1165" y="333" fill="#5e6c82" font-size="17">same contract, no repair</text></g><text x="700" y="402" text-anchor="middle" fill="#b13e54" font-family="Arial, sans-serif" font-size="18" font-weight="700">No manual category recoding. No hand-added missing columns. No test-set fitting.</text></svg>
