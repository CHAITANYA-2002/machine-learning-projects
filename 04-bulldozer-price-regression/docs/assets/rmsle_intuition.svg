<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc"><title id="title">RMSLE measures proportional error</title><desc id="desc">Two examples show a doubling error at different price levels treated as a comparable logarithmic miss.</desc><rect width="1400" height="340" rx="26" fill="#f7f9fc"/><text x="70" y="63" fill="#182536" font-family="Arial, sans-serif" font-size="31" font-weight="700">RMSLE cares about proportional error, not only dollar distance</text><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="105" y="120" width="420" height="130" rx="17" fill="#e8f1fb" stroke="#9dbbe0" stroke-width="2"/><text x="315" y="163" fill="#182536" font-size="21" font-weight="700">Example A</text><text x="315" y="199" fill="#5e6c82" font-size="20">actual $10,000 → predicted $20,000</text><text x="315" y="229" fill="#247ba0" font-size="18" font-weight="700">a 2× error</text><rect x="875" y="120" width="420" height="130" rx="17" fill="#eaf7f1" stroke="#83c8b5" stroke-width="2"/><text x="1085" y="163" fill="#182536" font-size="21" font-weight="700">Example B</text><text x="1085" y="199" fill="#5e6c82" font-size="20">actual $100,000 → predicted $200,000</text><text x="1085" y="229" fill="#138a72" font-size="18" font-weight="700">also a 2× error</text><path d="M550 185h300" stroke="#d08423" stroke-width="6"/><path d="M850 185l-20-13v26z" fill="#d08423"/><text x="700" y="160" fill="#d08423" font-size="19" font-weight="700">comparable log-scale miss</text></g><text x="700" y="302" text-anchor="middle" fill="#5e6c82" font-family="Arial, sans-serif" font-size="18">RMSLE requires non-negative actual prices and predictions; the project enforces that before scoring.</text></svg>
